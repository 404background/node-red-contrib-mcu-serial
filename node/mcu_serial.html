<script type="text/javascript">
    (function () {
        function number(v) {
            return v !== "" && Number.isInteger(Number(v)) && Number(v) >= 0;
        }
        // Each type gets its own copy: the editor keeps a reference to it.
        function defaults() {
            return {
                name: {value: ""},
                tx: {value: "", required: true, validate: number},
                rx: {value: "", required: true, validate: number},
                baud: {value: "115200", required: true, validate: number},
                port: {value: "", required: true, validate: number},
                moddable_manifest: {
                    value: {
                        include: [
                            {
                                "git": "https://github.com/404background/node-red-contrib-mcu-serial.git"
                            }
                        ]
                    }
                }
            };
        }

        RED.nodes.registerType('mcu_serial_in', {
            category: 'MCU',
            color: '#a2aaff',
            defaults: defaults(),
            inputs: 0,
            outputs: 1,
            icon: "serial.svg",
            align: "left",
            paletteLabel: 'serial in',
            label: function() {
                return this.name || "serial in";
            },
            labelStyle: function() {
                return this.name ? "node_label_italic" : "";
            }
        });

        RED.nodes.registerType('mcu_serial_out', {
            category: 'MCU',
            color: '#a2aaff',
            defaults: defaults(),
            inputs: 1,
            outputs: 0,
            icon: "serial.svg",
            align: "right",
            paletteLabel: 'serial out',
            label: function() {
                return this.name || "serial out";
            },
            labelStyle: function() {
                return this.name ? "node_label_italic" : "";
            }
        });
    })();
</script>

<script type="text/html" data-template-name="mcu_serial_in">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> <span data-i18n="mcu_serial.label.name"></span></label>
        <input type="text" id="node-input-name" data-i18n="[placeholder]mcu_serial.label.name">
    </div>
    <div class="form-row">
        <label for="node-input-port"><i class="fa fa-random"></i> <span data-i18n="mcu_serial.label.port"></span></label>
        <input type="number" id="node-input-port" min="0" style="width:80px">
    </div>
    <div class="form-row">
        <label for="node-input-tx"><i class="fa fa-arrow-right"></i> <span data-i18n="mcu_serial.label.tx"></span></label>
        <input type="number" id="node-input-tx" min="0" style="width:80px">
    </div>
    <div class="form-row">
        <label for="node-input-rx"><i class="fa fa-arrow-left"></i> <span data-i18n="mcu_serial.label.rx"></span></label>
        <input type="number" id="node-input-rx" min="0" style="width:80px">
    </div>
    <div class="form-row">
        <label for="node-input-baud"><i class="fa fa-tachometer"></i> <span data-i18n="mcu_serial.label.baud"></span></label>
        <input type="number" id="node-input-baud" min="1" style="width:120px">
    </div>
    <div class="form-tips" data-i18n="mcu_serial.tip"></div>
</script>

<script type="text/html" data-template-name="mcu_serial_out">

    </div>
    <div class="form-row">
        <label for="node-input-tx"><i class="fa fa-arrow-right"></i> <span data-i18n="mcu_serial.label.tx"></span></label>
        <input type="number" id="node-input-tx" min="0" style="width:80px">
    </div>
    <div class="form-row">
        <label for="node-input-rx"><i class="fa fa-arrow-left"></i> <span data-i18n="mcu_serial.label.rx"></span></label>
