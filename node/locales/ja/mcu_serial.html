<script type="text/html" data-help-name="mcu_serial_in">
    <p>MCUのUARTからテキストを受信します（Node-RED MCU Edition専用）。</p>
    <h3>出力</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">文字列</span></dt>
        <dd>受信した1行（改行は含みません）。</dd>
    </dl>
    <h3>詳細</h3>
    <p>受信データは <code>\n</code> で行に分けて送ります。末尾の <code>\r</code> と空行は除きます。
       改行で終わらないデータは、100ms 新しいデータが来なければそのまま送ります。1024文字を超えた行もそのまま送ります。</p>
    <h3>プロパティ</h3>
    <dl class="message-properties">
        <dt>ポート</dt><dd>UART番号（ESP32なら 1 や 2）。</dd>
        <dt>TXピン / RXピン</dt><dd>送信・受信に使うGPIO番号。</dd>
        <dt>ボーレート</dt><dd>通信速度（例: 115200）。</dd>
    </dl>
    <p>同じポートの serial in / serial out ノードは1つのUARTを共有します。ピンとボーレートは揃えてください。
       設定が異なるノードはエラーになり、接続されません。</p>
</script>

<script type="text/html" data-help-name="mcu_serial_out">
    <p><code>msg.payload</code> をMCUのUARTへ送信します（Node-RED MCU Edition専用）。</p>
    <h3>入力</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">文字列 | 数値 | オブジェクト | バッファ</span></dt>
        <dd>文字列と数値は末尾に <code>\n</code> を付けて送ります。オブジェクトはJSONにして <code>\n</code> を付けて送ります。
            <code>ArrayBuffer</code> や型付き配列（<code>Uint8Array</code> など）はそのままのバイト列で送ります。</dd>
    </dl>
    <h3>プロパティ</h3>
    <dl class="message-properties">
        <dt>ポート</dt><dd>UART番号（ESP32なら 1 や 2）。</dd>
        <dt>TXピン / RXピン</dt><dd>送信・受信に使うGPIO番号。</dd>
        <dt>ボーレート</dt><dd>通信速度（例: 115200）。</dd>
    </dl>
    <p>同じポートの serial in / serial out ノードは1つのUARTを共有するため、ピンとボーレートを揃えてください。</p>
</script>
